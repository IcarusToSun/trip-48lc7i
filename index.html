<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>가고시마 여행 계획 · 2026.11.14–11.18</title>
<!-- tools/build.mjs 가 이 템플릿의 trip-data 블록을 채워 ../index.html 을 만든다. 화면 코드는 여기서 고친다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --ink: #1c1e22;
  --ink-2: #3b3e45;
  --muted: #6c717a;
  --line: #e3e1db;
  --line-2: #efede8;
  --hover: #faf9f6;
  --sel: #fff6dc;
  --no: #b42318;   --no-bg: #fdecea;
  --unk: #7a5b00;  --unk-bg: #fff3cf;
  --move: #44474f; /* 공항버스·셔틀·페리 */
  --fly: #1769c2;  /* 항공편 시각 — 항공권과 같은 파랑 */
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06);
  --font: "Pretendard Variable", Pretendard, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all; overflow-wrap: anywhere;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
[lang="ja"] { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", var(--font); }
small.ja { margin-left: 0.2em; font-size: 0.8em; font-weight: 400; color: var(--muted); }
.muted { color: var(--muted); }
svg { flex: none; }

/* ---------- 헤더·메인 탭 ---------- */
.top {
  flex: none; display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
  position: relative; z-index: 30;
}
.brand h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.main-tabs { display: flex; gap: 4px; margin-left: auto; background: var(--line-2); padding: 4px; border-radius: 10px; }
.main-tabs button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 7px;
  font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
}
.main-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
main { flex: 1; min-height: 0; position: relative; }
.view { height: 100%; }
.view[hidden] { display: none !important; } /* #view-plan 의 display 규칙보다 우선 */

/* ---------- 계획표 ---------- */
#view-plan { display: flex; flex-direction: column; }
.map-wrap { position: relative; flex: none; height: clamp(240px, 40vh, 560px); background: #e9eef1; }
.map { position: absolute; inset: 0; }
.map-msg {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 20px;
  color: var(--muted); text-align: center; font-size: 14px; background: #eef1f3;
}
.map-msg[hidden] { display: none; }
.map-legend {
  position: absolute; left: 10px; top: 10px; z-index: 2;
  display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 120px);
  padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.92);
  box-shadow: 0 1px 4px rgba(0,0,0,.15); font-size: 11.5px; color: var(--ink-2);
}
.map-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.lg { display: inline-block; width: 12px; height: 12px; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); background: var(--ink-2); }
.lg-visit { border-radius: 50%; }
.lg-stay { border-radius: 3px; }
.lg-air { border-radius: 50%; background: var(--ink); }
.lg-stop { border-radius: 4px; background: var(--move); transform: rotate(45deg) scale(.85); }
.lg-line { width: 18px; height: 0; border: 0; box-shadow: none; border-top: 2.5px dashed var(--ink-2); }
.map-wrap.is-short .map-legend { display: none; } /* 지도를 낮게 줄이면 범례가 지도를 다 가린다 */
/* 지도 높이 조절 막대: 끌거나(마우스·터치) 작게·보통·크게 버튼 */
.map-bar { flex: none; display: flex; align-items: stretch; height: 30px; background: var(--surface); border-bottom: 1px solid var(--line); }
.map-resizer {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: row-resize; touch-action: none; user-select: none; -webkit-user-select: none;
}
.map-resizer:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }
.mr-grip { flex: none; width: 44px; height: 5px; border-radius: 3px; background: #c9c6bf; }
.map-resizer:hover .mr-grip, .map-resizer:focus-visible .mr-grip { background: var(--ink-2); }
.mr-hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: var(--muted); }
.map-sizes { flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 4px; }
.map-sizes button {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 6px; cursor: pointer;
}
.map-sizes button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
body.is-resizing { cursor: row-resize; user-select: none; -webkit-user-select: none; }

.plan-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.day-tabs {
  flex: none; display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto;
  background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: thin;
}
.day-tabs button {
  flex: 1 0 auto; min-width: 104px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 7px 12px 7px 30px; position: relative; cursor: pointer; text-align: left;
}
.day-tabs button::before {
  content: ""; position: absolute; left: 11px; top: 12px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--c, var(--ink)); box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.08);
}
.day-tabs button[data-day="all"]::before { background: conic-gradient(#D55E00 0 20%, #0072B2 0 40%, #009E73 0 60%, #CC79A7 0 80%, #E69F00 0); }
.day-tabs .dt-k { font-weight: 700; font-size: 14px; white-space: nowrap; }
.day-tabs .dt-s { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.day-tabs button[aria-selected="true"] { border-color: var(--c, var(--ink)); box-shadow: inset 0 0 0 1px var(--c, var(--ink)); background: color-mix(in srgb, var(--c, var(--ink)) 7%, #fff); }
.day-panel { flex: 1; min-height: 0; overflow: auto; }
.day-panel.is-md { overflow: hidden; }
.dp-wrap { max-width: 980px; margin: 0 auto; padding: 18px 20px 48px; }
.dl-wrap { padding: 16px 16px 40px; }
.day-head { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; }
.day-head h2 { margin: 0; font-size: 19px; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--c); color: #fff; }
.blk { margin-top: 16px; }
.blk > h3, .ov h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }

.flight {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 18px 12px; box-shadow: var(--shadow);
}
.fl-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.fl-top .fl-dir { font-weight: 800; color: var(--ink); }
.fl-top .fl-no { font-weight: 700; color: var(--ink); }
.fl-route { display: grid; grid-template-columns: 1fr minmax(80px, 1.2fr) 1fr; align-items: center; gap: 10px; margin: 10px 0 8px; }
.fl-end b { display: block; font-size: 30px; line-height: 1.1; color: var(--fly); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.fl-end span { display: block; font-weight: 700; margin-top: 2px; }
.fl-end small { display: block; color: var(--muted); font-size: 12px; }
.fl-end.to { text-align: right; }
.fl-mid { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.fl-mid::before, .fl-mid::after { content: ""; flex: 1; border-top: 2px dotted #c9c6bf; }
.fl-meta { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.ov-flights { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }

.notes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.note { font-size: 13.5px; padding: 8px 12px 8px 34px; border-radius: 10px; position: relative; background: #eef3f8; color: #23415f; }
.note::before { content: "i"; position: absolute; left: 11px; top: 9px; width: 16px; height: 16px; border-radius: 50%; background: #23415f; color: #fff; font: 700 11px/16px var(--font); text-align: center; }
.note-warn { background: var(--no-bg); color: #7a1c13; }
.note-warn::before { content: "!"; background: var(--no); }
.note-src { margin-left: 4px; font-size: 12px; }

/* 일정 목록: 시간 칸 없이 순서대로. 정해진 시각이 있는 항목만 제목 앞에 시각 */
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tl-item {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
  padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); cursor: pointer;
}
.tl-item:hover { background: var(--hover); }
.tl-item:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.tl-item.is-sel { background: var(--sel); border-color: color-mix(in srgb, var(--c) 55%, #fff); box-shadow: inset 4px 0 0 var(--c); }
.tl-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.tl-dot.sq { border-radius: 7px; }
.tl-title { font-weight: 700; }
.tl-title small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 12px; }
.tl-tm { display: inline-block; font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 800; color: var(--fly); background: #e8f1fb; border-radius: 5px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; }
.tl-memo { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.hint { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }
.empty { padding: 14px; border: 1.5px dashed #d6d2c9; border-radius: 12px; color: var(--muted); font-size: 13.5px; background: #fbfaf7; }

.ov-days { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
.ov-days th, .ov-days td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.ov-days th { font-size: 12px; color: var(--muted); background: #fbfaf7; font-weight: 700; }
.ov-days tr:last-child td { border-bottom: 0; }
.ov-days tbody tr { cursor: pointer; }
.ov-days tbody tr:hover td { background: var(--hover); }
.ov-days .dcell { white-space: nowrap; font-weight: 700; }
.ov-days .dcell small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }

/* ---------- 지도 마커·팝업 ---------- */
.mk {
  display: grid; place-items: center; cursor: pointer; position: relative;
  transition: opacity .2s, filter .2s, transform .2s; border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.45);
}
.mk:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
.mk-visit { width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font: 800 12px/1 var(--font); }
.mk-stay { width: 28px; height: 28px; border-radius: 8px; background: var(--c); color: #fff; }
.mk-stay .nights { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); display: flex; gap: 2px; }
.mk-stay .nights i { width: 8px; height: 8px; border-radius: 50%; background: var(--n); border: 1.5px solid #fff; }
.mk-airport { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; }
.mk-stop { width: 24px; height: 24px; border-radius: 6px; background: var(--move); color: #fff; }
.mk.is-dim { opacity: .27; filter: grayscale(.75); }
.mk.is-active { transform: scale(1.2); }
.mk.is-sel { transform: scale(1.35); box-shadow: 0 0 0 3px rgba(0,0,0,.25), 0 1px 4px rgba(0,0,0,.45); }
.maplibregl-popup { z-index: 2000; } /* 마커에 준 z-index 보다 위 */
.maplibregl-popup-content { border-radius: 10px; padding: 10px 14px 10px 12px; font: 13px/1.45 var(--font); box-shadow: 0 4px 18px rgba(0,0,0,.2); }
.maplibregl-popup-close-button { font-size: 18px; padding: 0 6px; color: var(--muted); }
.pop-k { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-right: 14px; }
.pop-k i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.pop-k i.sq { border-radius: 2px; }
.pop-t { font-weight: 800; font-size: 14px; margin-top: 2px; }
.pop-t span { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 4px; }
.pop-a { display: flex; gap: 12px; margin-top: 7px; font-weight: 700; font-size: 12.5px; }
.pop-a a { color: var(--fly); text-decoration: none; }

/* ---------- 계획표 날짜: 목록-상세 ---------- */
.md { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; grid-template-rows: minmax(0, 1fr); height: 100%; }
.md-list { overflow: auto; background: var(--surface); border-right: 1px solid var(--line); }
.md-list .tl-item { background: var(--surface); }
.md-list .tl-item.is-sel { background: var(--sel); }
.md-detail { overflow: auto; background: var(--bg); }
.d-wrap { max-width: 780px; margin: 0 auto; padding: 22px 28px 56px; }
.back { display: none; border: 0; background: transparent; font-weight: 700; padding: 6px 0; margin-bottom: 6px; cursor: pointer; color: var(--ink-2); }
.d-kicker { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.d-title { margin: 3px 0 4px; font-size: 25px; line-height: 1.25; letter-spacing: -0.01em; }
.d-title span { display: inline-block; font-size: 15px; font-weight: 500; color: var(--muted); }
.d-sum { margin: 0; font-size: 15px; color: var(--ink-2); }
.d-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: 14px;
  padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
}
.btn:hover { border-color: var(--ink); }
.btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-primary:hover { background: #000; }
.d-sec { margin-top: 22px; }
.d-sec h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.d-sec p { margin: 0; }
.d-sec p + p { margin-top: 6px; }
.d-sec ul { margin: 0; padding-left: 18px; }
.d-sec li { margin: 3px 0; }
.d-sec.warn-list ul { list-style: none; padding: 10px 12px 10px 14px; background: var(--no-bg); color: #7a1c13; border-radius: 10px; }
.d-sec.warn-list li::before { content: "! "; font-weight: 800; }
.d-sub { margin: 14px 0 6px; font-size: 14px; }
.facts { display: grid; grid-template-columns: 104px 1fr; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.facts dt, .facts dd { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line-2); font-size: 14px; }
.facts dt { color: var(--muted); font-weight: 700; font-size: 13px; background: #fbfaf7; }
.facts dt:nth-last-of-type(1), .facts dd:last-child { border-bottom: 0; }
/* 유저가 직접 적은 메모: 조사 내용과 구분되게 */
.mine { margin-top: 16px; padding: 10px 14px; border-radius: 12px; background: #fff7e0; border: 1px solid #f1dc9c; }
.mine h3 { margin: 0 0 4px; font-size: 12.5px; color: #7a5b00; }
.mine ul { margin: 0; padding-left: 18px; font-weight: 600; }
.mine li { margin: 2px 0; }
.mine .diff { font-weight: 500; font-size: 13px; color: var(--ink-2); list-style: none; margin-left: -18px; padding-top: 4px; border-top: 1px dashed #e6cf88; margin-top: 6px; }
.ckio { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.ckio > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.ckio small { display: block; color: var(--muted); font-weight: 700; font-size: 12px; }
.ckio b { display: block; font-size: 17px; margin-top: 2px; }
.picks { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
.picks th, .picks td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line-2); }
.picks th { font-size: 12px; color: var(--muted); background: #fbfaf7; }
.picks td.t { font-variant-numeric: tabular-nums; font-weight: 800; }
.picks tr:last-child td { border-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font-variant-numeric: tabular-nums; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.d-src { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
.d-src h3 { margin: 0 0 6px; font-size: 12.5px; color: var(--muted); }
.d-src ol { margin: 0 0 6px; padding-left: 18px; }
.d-src a { color: var(--ink-2); }
.d-src p { margin: 4px 0 0; }
.unc { color: var(--unk); background: var(--unk-bg); border-radius: 8px; padding: 6px 10px; }
.unc ul { margin: 4px 0 0; padding-left: 18px; }
.d-empty { padding: 40px 28px; color: var(--muted); }

/* ---------- TODO·음식·참고사항·시간표 ---------- */
.page { overflow: auto; }
.pg-wrap { max-width: 980px; margin: 0 auto; padding: 22px 20px 56px; }
.pg-wrap > h2 { margin: 0 0 12px; font-size: 22px; }
.plain { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.plain li { padding: 12px 16px; border-bottom: 1px solid var(--line-2); font-size: 15.5px; font-weight: 600; }
.plain li:last-child { border-bottom: 0; }
.plain li ul { margin: 6px 0 0; padding-left: 18px; font-weight: 500; font-size: 14.5px; color: var(--ink-2); }
.plain li .diff { list-style: none; margin: 8px 0 0 -18px; padding: 8px 10px; border-radius: 8px; background: #eef3f8; color: #23415f; font-size: 13.5px; }
.pg-sec { margin-top: 26px; }
.pg-sec > h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.stays { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
.stays th, .stays td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.stays th { font-size: 12px; color: var(--muted); background: #fbfaf7; }
.stays tr:last-child td { border-bottom: 0; }
.stays a { color: var(--fly); font-weight: 700; text-decoration: none; }
.seg { display: flex; gap: 4px; background: var(--line-2); padding: 4px; border-radius: 10px; }
.seg[hidden] { display: none; } /* display:flex 가 hidden 속성의 기본 숨김을 이기므로 */
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg-sub { margin-top: 8px; background: transparent; padding: 0; gap: 6px; }
.seg-sub button { border: 1px solid var(--line); background: var(--surface); }
.seg-sub button[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.seg-sub button small { display: block; font-weight: 500; font-size: 11.5px; }
.tt-head { margin-top: 18px; }
.tt-head h2 { margin: 0; font-size: 21px; }
.tt-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.tt-dir { margin-top: 22px; }
.tt-dir h3 { margin: 0; font-size: 16px; }
.tt-dir > p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
.tt-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tt { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.tt th, .tt td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); text-align: center; white-space: nowrap; }
.tt th { position: sticky; top: 0; background: #fbfaf7; font-size: 12.5px; vertical-align: bottom; }
.tt th small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
.tt td.nt { text-align: left; color: var(--muted); font-size: 12px; white-space: normal; min-width: 120px; }
.tt tr.is-plan td { background: var(--sel); font-weight: 800; }
.tt-h mark.is-plan { background: var(--sel); color: inherit; font-weight: 800; border-radius: 4px; padding: 0 2px; }
.chips span.is-plan { background: var(--sel); border-color: var(--ink); font-weight: 800; }
.tt .pl, .tt-h .pl { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: var(--c, var(--ink)); border-radius: 4px; padding: 0 5px; margin: 1px 2px; }
.tt .na { color: #c3c0b8; }
.tt-hours { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tt-h { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tt-h th, .tt-h td { padding: 5px 10px; border-bottom: 1px solid var(--line-2); text-align: left; }
.tt-h th { width: 52px; color: var(--muted); font-size: 13px; }
.tt-h td { letter-spacing: .02em; }

/* ---------- 휴대폰 ---------- */
@media (max-width: 899px) {
  .top { flex-wrap: wrap; gap: 8px; padding: 10px 12px 8px; }
  .main-tabs { margin-left: 0; width: 100%; overflow-x: auto; scrollbar-width: none; }
  .main-tabs button { flex: 1 0 auto; padding: 7px 8px; font-size: 13.5px; }
  #view-plan { display: block; overflow: auto; }
  .map-wrap { height: clamp(200px, 34vh, 360px); }
  .map-bar { height: 40px; }
  .map-sizes button { padding: 5px 11px; }
  .plan-body { display: block; }
  .day-tabs { position: sticky; top: 0; z-index: 4; padding: 8px 10px; }
  .day-tabs button { flex: 0 0 auto; min-width: 92px; }
  .day-panel, .day-panel.is-md { overflow: visible; }
  .dp-wrap { padding: 14px 12px 40px; }
  .dl-wrap { padding: 14px 12px 40px; }
  .fl-end b { font-size: 24px; }
  .map-legend { max-width: calc(100% - 60px); top: 6px; left: 6px; gap: 2px 8px; font-size: 11px; }
  /* 상세는 지도 아래를 덮는다(top 은 스크립트가 높이 막대 아래로 맞춤) */
  .md { display: block; height: auto; }
  .md-list { border-right: 0; overflow: visible; }
  .md-detail {
    position: fixed; inset: 0; z-index: 60; visibility: hidden;
    transform: translateX(100%); transition: transform .22s ease;
  }
  .md.show-detail .md-detail { visibility: visible; transform: none; }
  .d-wrap { padding: 8px 16px 48px; }
  .back { display: inline-block; position: sticky; top: 0; z-index: 3; background: var(--bg); width: 100%; text-align: left; padding: 10px 0; margin: 0 0 8px; }
  .d-title { font-size: 21px; }
  /* 좁은 화면에선 라벨이 긴 칸(「사쿠라지마 관광안내소(…)」 등)이 세로로 쪼개지지 않게 라벨을 값 위에 둔다 */
  .facts { grid-template-columns: 1fr; }
  .facts dt { border-bottom: 0; padding-bottom: 2px; background: none; }
  .facts dd { padding-top: 2px; }
  .pg-wrap { padding: 16px 12px 48px; }
  .tt-hours { grid-template-columns: 1fr; }
}
</style>

<header class="top">
  <div class="brand">
    <h1 id="trip-title">가고시마 여행</h1>
    <p id="trip-period"></p>
  </div>
  <nav class="main-tabs" role="tablist" aria-label="메뉴">
    <button type="button" role="tab" id="tab-plan" aria-controls="view-plan" data-view="plan">계획표</button>
    <button type="button" role="tab" id="tab-todo" aria-controls="view-todo" data-view="todo">TODO 리스트</button>

    <button type="button" role="tab" id="tab-notes" aria-controls="view-notes" data-view="notes">참고사항</button>
    <button type="button" role="tab" id="tab-timetable" aria-controls="view-timetable" data-view="timetable">시간표</button>
  </nav>
</header>
<main>
  <section id="view-plan" class="view" role="tabpanel" aria-labelledby="tab-plan">
    <div id="map-wrap" class="map-wrap">
      <div id="map" class="map" role="region" aria-label="여행 지도"></div>
      <div class="map-legend" aria-hidden="true">
        <span><i class="lg lg-visit"></i>방문지(숫자 = 순서)</span>
        <span><i class="lg lg-stay"></i>숙소</span>
        <span><i class="lg lg-air"></i>공항</span>
        <span><i class="lg lg-stop"></i>정류장·항구</span>
        <span><i class="lg lg-line"></i>이동 순서(직선)</span>
      </div>
      <div id="map-msg" class="map-msg" hidden></div>
    </div>
    <div class="map-bar">
      <div id="map-resizer" class="map-resizer" role="separator" aria-orientation="horizontal" aria-controls="map-wrap" tabindex="0"
        aria-label="지도 높이 조절 (위·아래 화살표 키, Enter 는 보통 크기)">
        <span class="mr-grip" aria-hidden="true"></span><span class="mr-hint" aria-hidden="true">끌어서 지도 높이 조절</span>
      </div>
      <div class="map-sizes" role="group" aria-label="지도 크기">
        <button type="button" data-map-size="small">작게</button>
        <button type="button" data-map-size="normal">보통</button>
        <button type="button" data-map-size="large">크게</button>
      </div>
    </div>
    <div class="plan-body">
      <div id="day-tabs" class="day-tabs" role="tablist" aria-label="날짜 선택"></div>
      <div id="day-panel" class="day-panel" role="tabpanel"></div>
    </div>
  </section>

  <section id="view-todo" class="view page" role="tabpanel" aria-labelledby="tab-todo" hidden><div class="pg-wrap" id="todo-body"></div></section>
  <section id="view-food" class="view page" role="tabpanel" aria-labelledby="tab-food" hidden><div class="pg-wrap" id="food-body"></div></section>
  <section id="view-notes" class="view page" role="tabpanel" aria-labelledby="tab-notes" hidden><div class="pg-wrap" id="notes-body"></div></section>
  <section id="view-timetable" class="view page" role="tabpanel" aria-labelledby="tab-timetable" hidden>
    <div class="pg-wrap">
      <div id="tt-seg" class="seg" role="tablist" aria-label="시간표 종류">
        <button type="button" role="tab" data-tt="bus">공항버스</button>
        <button type="button" role="tab" data-tt="ferry">페리</button>
      </div>
      <div id="tt-sub" class="seg seg-sub" role="tablist" aria-label="공항버스 노선"></div>
      <div id="tt-body"></div>
    </div>
  </section>
</main>

    const dow = DOW[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
    return { m, d, dow, short: `${m}/${d}`, long: `${m}월 ${d}일 (${dow})` };
  }
  function gmaps(s) {
    if (!s) return null;
    if (s.links && s.links.gmaps) return s.links.gmaps;
    return s.gmapsQuery ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.gmapsQuery) : null;
  }
  function extLink(url, labelHTML, cls, aria) {
    if (!url || !/^https?:\/\//i.test(url)) return ''; // 조사 데이터의 주소는 http(s) 만 링크로 만든다(javascript: 등 차단)
    return `<a${cls ? ` class="${cls}"` : ''} href="${esc(url)}" target="_blank" rel="noopener noreferrer"${aria ? ` aria-label="${esc(plain(aria))}"` : ''}>${labelHTML}</a>`;
  }
  // 그날 목록 항목: 일정 순서대로, 끝에 「오늘 밤 숙소」(id 'stay')
  function entriesOf(day) {
    const es = (day.items || []).map((item) => ({ id: item.id, item }));
    if (day.stay && SPOTS.has(day.stay)) es.push({ id: 'stay', item: null });
    return es;
  }

  // ---------- 라우팅: #plan[/날짜[/항목]] · #todo · #food · #notes · #timetable/<bus-city|bus-myoken|ferry>
  const VIEWS = ['plan', 'todo', 'food', 'notes', 'timetable'];
  const TT_IDS = ['bus-city', 'bus-myoken', 'ferry'];
  const lastHash = { plan: '#plan', todo: '#todo', food: '#food', notes: '#notes', timetable: '#timetable/bus-city' };
  let navFromList = false; // 휴대폰: 지금 상세가 그날 목록에서 눌러 기록에 쌓은 것인가(그때만 「← 목록」이 뒤로 가기)
  let lastBus = 'bus-city'; // 시간표에서 페리 → 공항버스로 돌아올 때 열 노선
  function parseHash() {
    let h;
    try { h = decodeURIComponent(location.hash.replace(/^#/, '')); } catch { h = 'plan'; } // 깨진 %인코딩이면 계획표로
    const [view, a, b] = h.split('/');
    if (view === 'timetable') return { view, tt: TT_IDS.includes(a) ? a : 'bus-city' };
    if (VIEWS.includes(view) && view !== 'plan') return { view };
    const day = a && dayByDate.has(a) ? a : 'all';
    const item = day !== 'all' && b && entriesOf(dayByDate.get(day).day).some((e) => e.id === b) ? b : null;
    return { view: 'plan', day, item };
  }
  function go(hash, replace) {
    if (location.hash === hash) return;
    if (replace) location.replace(hash); else location.hash = hash;
  }
  function showView(view) {
    $$('.main-tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === view)));
    VIEWS.forEach((v) => { $(`#view-${v}`).hidden = v !== view; });
  }
  function route() {
    const r = parseHash();
    if (!(r.view === 'plan' && r.item)) navFromList = false;
    lastHash[r.view] = location.hash || '#plan';
    if (r.view === 'timetable' && r.tt !== 'ferry') lastBus = r.tt; // 주소·「시간표 전체 보기」로 들어온 노선도 기억
    showView(r.view);
    if (r.view === 'plan') renderPlan(r.day, r.item);
    else if (r.view === 'timetable') renderTimetable(r.tt);
    else renderPage(r.view);
  }

  // ---------- 계획표: 지도
  let map = null, mapFailed = false, popup = null, currentDay = null;
  let mapUserMoved = false; // 사용자가 지도를 직접 옮기거나 확대했으면 지도 높이를 바꿔도 그날 범위로 다시 맞추지 않는다
  let markers = [];
  const markerByKey = new Map();
  let model = null;
  let planSel = null; // 주소에 항목이 있어 지도를 그 항목에 맞춘 상태 { date, id }
  // 방문 번호·숙소 색은 지도 없이도 필요하다(해외에서 지도 라이브러리를 못 받아도 일정은 그대로 보이게)
  const getModel = () => model || (model = buildModel());

  function dedupe(coords) {
    return coords.filter((c, i) => i === 0 || c[0] !== coords[i - 1][0] || c[1] !== coords[i - 1][1]);
  }
  // 날짜별 동선 = 전날 숙소 → 그날 항목 순서대로(이동 항목은 출발 → 도착) → 그날 숙소.
  // 공항·정류장·항구·숙소는 마커 하나를 같이 쓰고, 방문지는 그날 순서 번호를 단다.
  function buildModel() {
    const pts = [], lines = [], shared = new Map(), keysOfEntry = new Map();
    function sharedRec(s, day) {
      let r = shared.get(s.id);
      if (!r) {
        const kind = s.kind === 'stay' ? 'stay' : s.kind === 'airport' ? 'airport' : 'stop';
        r = { key: s.id, kind, spot: s, lng: s.lng, lat: s.lat, color: kind === 'stay' ? day.color : kind === 'airport' ? '#1c1e22' : '#44474f', days: new Set(), nights: [], events: [] };
        shared.set(s.id, r); pts.push(r);
      }
      return r;
    }
    DAYS.forEach((day, i) => {
      const seq = [];
      const prev = i > 0 ? shared.get(DAYS[i - 1].stay) : null;
      if (prev) { prev.days.add(day.date); seq.push([prev.lng, prev.lat]); }
      let n = 0;
      (day.items || []).forEach((item) => {
        const ek = `${day.date}#${item.id}`, keys = [];
        const ids = item.from || item.to ? [item.from, item.to] : [item.spot];
        ids.forEach((id) => {
          const s = SPOTS.get(id);
          if (!hasPt(s)) return;
          let r;
          if (SHARED_KINDS.has(s.kind)) r = sharedRec(s, day);
          else {
            n += 1;
            r = { key: ek, kind: 'visit', spot: s, lng: s.lng, lat: s.lat, color: day.color, days: new Set(), nights: [], events: [], order: n };
            pts.push(r);
          }
          r.days.add(day.date);
          if (!r.events.some((ev) => ev.item === item)) r.events.push({ day, item });
          keys.push(r.key); seq.push([r.lng, r.lat]);
        });
        if (keys.length) keysOfEntry.set(ek, keys);
      });
      const st = SPOTS.get(day.stay);
      if (hasPt(st)) {
        const r = sharedRec(st, day);
        r.days.add(day.date); r.nights.push(day);
        keysOfEntry.set(`${day.date}#stay`, [r.key]);
        seq.push([r.lng, r.lat]);
      }
      const coords = dedupe(seq);
      if (coords.length >= 2) lines.push({ type: 'Feature', properties: { day: day.date, color: day.color }, geometry: { type: 'LineString', coordinates: coords } });
    });
    return { pts, lines, keysOfEntry };
  }
  const recOf = (key) => getModel().pts.find((r) => r.key === key);

  function markerLabel(rec) {
    const s = rec.spot;
    if (rec.kind === 'visit') { const ev = rec.events[0]; return `${dayInfo(ev.day.date).short} ${rec.order}번째 방문지: ${ev.item.title}`; }
    if (rec.kind === 'stay') return `숙소: ${s.name} (${rec.nights.map((n) => dayInfo(n.date).short).join(', ')} 밤)`;
    return `${rec.kind === 'airport' ? '공항' : s.kind === 'terminal' ? '항구' : '정류장'}: ${s.name}${s.nameJa ? ' ' + s.nameJa : ''}`;
  }
  function makeMarkerEl(rec) {
    const root = document.createElement('div');
    const el = document.createElement('div');
    el.className = `mk mk-${rec.kind}`;
    el.style.setProperty('--c', rec.color);
    el.dataset.days = [...rec.days].join(' ');
    if (rec.kind === 'visit') el.textContent = String(rec.order);
    else if (rec.kind === 'stay') el.innerHTML = ICON.bed + `<span class="nights">${rec.nights.map((n) => `<i style="--n:${esc(n.color)}"></i>`).join('')}</span>`;
    else if (rec.kind === 'airport') el.innerHTML = ICON.plane;
    else el.innerHTML = rec.spot.kind === 'terminal' ? ICON.ship : ICON.bus;
    el.setAttribute('role', 'button');
    el.tabIndex = 0;
    el.setAttribute('aria-label', markerLabel(rec));
    el.title = plain(markerLabel(rec));
    root.appendChild(el);
    return { root, el };
  }
  function popupHTML(rec, ev) {
    const s = rec.spot;
    let kick;
    if (rec.kind === 'visit') {
      const di = dayInfo(ev.day.date);
      kick = `<i style="--c:${esc(ev.day.color)}"></i>${di.short} (${di.dow}) · ${rec.order}번째`;
    } else if (rec.kind === 'stay') {
      kick = `<i class="sq" style="--c:${esc(rec.color)}"></i>숙소 · ${rec.nights.map((n) => dayInfo(n.date).short).join(', ')} 밤`;
    } else {
      kick = `<i style="--c:${esc(rec.color)}"></i>${rec.kind === 'airport' ? '공항' : s.kind === 'terminal' ? '항구' : '정류장'}`;
    }
    const title = rec.kind === 'visit' && ev ? ev.item.title : s.name;
    const gm = gmaps(s);
    return `<div class="pop"><div class="pop-k">${kick}</div>` +
      `<div class="pop-t">${esc(title)}${s.nameJa ? `<span lang="ja">${esc(s.nameJa)}</span>` : ''}</div>` +
      (gm ? `<div class="pop-a">${extLink(gm, '구글맵 ↗')}</div>` : '') + '</div>';
  }
  function showMapMsg(text) { const m = $('#map-msg'); m.textContent = text; m.hidden = false; }

  function ensureMap() {
    if (map || mapFailed) return;
    if (!window.maplibregl) { mapFailed = true; showMapMsg('지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요. (일정·시간표는 그대로 볼 수 있습니다)'); return; }
    try {
      map = new maplibregl.Map({
        container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
        center: DEFAULT_VIEW.center, zoom: DEFAULT_VIEW.zoom,
        attributionControl: { compact: true },
        localIdeographFontFamily: '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans CJK JP", sans-serif',
      });
    } catch (e) {
      mapFailed = true; showMapMsg('지도를 만들지 못했습니다: ' + e.message); return;
    }
    try { setupMap(); } catch (e) { // 마커·컨트롤 단계에서 깨져도 일정 목록·상세는 그려지게 지도만 접는다
      try { map.remove(); } catch { /* 이미 깨진 지도 */ }
      map = null; mapFailed = true; markers = []; markerByKey.clear();
      showMapMsg('지도를 그리지 못했습니다: ' + e.message);
    }
  }
  function setupMap() {
    window.__map = map; // 점검용
    popup = new maplibregl.Popup({ offset: 16, maxWidth: '290px' });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
    // 끌기·휠·두 손가락 등 사용자 입력에만 originalEvent 가 붙는다(fitTo 엔 없음). 창 크기 변경(resize 이벤트)은 사용자 이동으로 치지 않는다
    map.on('movestart', (e) => { const t = e.originalEvent && e.originalEvent.type; if (t && t !== 'resize') mapUserMoved = true; });
    markers = getModel().pts.map((rec) => {
      const { root, el } = makeMarkerEl(rec);
      const mk = new maplibregl.Marker({ element: root, anchor: 'center' }).setLngLat([rec.lng, rec.lat]).addTo(map);
      el.addEventListener('click', (e) => { e.stopPropagation(); openFromMarker(rec); });
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFromMarker(rec); } });
      const m = { rec, root, el, mk };
      markerByKey.set(rec.key, m);
      return m;
    });
    map.on('load', () => {
      map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: model.lines } });
      map.addLayer({ id: 'routes-casing', type: 'line', source: 'routes', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': 6, 'line-opacity': 0.75 } });
      map.addLayer({ id: 'routes', type: 'line', source: 'routes', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': ['get', 'color'], 'line-width': 3, 'line-dasharray': [1.5, 1.6], 'line-opacity': 0.9 } });
      applyEmphasis(currentDay);
    });
    map.on('error', (e) => console.warn('[map]', e && e.error ? e.error.message : e));
  }
  function applyEmphasis(day) {
    const selKeys = new Set(planSel ? getModel().keysOfEntry.get(`${planSel.date}#${planSel.id}`) || [] : []);
    markers.forEach((m) => {
      const on = day === 'all' || m.rec.days.has(day);
      const sel = selKeys.has(m.rec.key);
      m.el.classList.toggle('is-dim', !on);
      m.el.classList.toggle('is-active', day !== 'all' && on && !sel);
      m.el.classList.toggle('is-sel', sel);
      m.root.style.zIndex = String(sel ? 100 : (day !== 'all' && on ? 20 : 0) + (m.rec.kind === 'visit' ? 3 : m.rec.kind === 'stay' ? 2 : 1));
    });
    if (!map || !map.getLayer('routes')) return;
    if (day === 'all' || !day) {
      map.setPaintProperty('routes', 'line-opacity', 0.9);
      map.setPaintProperty('routes', 'line-width', 3);
      map.setPaintProperty('routes-casing', 'line-opacity', 0.75);
      map.setLayoutProperty('routes', 'line-sort-key', 0);
    } else {
      const sel = ['==', ['get', 'day'], day];
      map.setPaintProperty('routes', 'line-opacity', ['case', sel, 1, 0.18]);
      map.setPaintProperty('routes', 'line-width', ['case', sel, 4, 2]);
      map.setPaintProperty('routes-casing', 'line-opacity', ['case', sel, 0.9, 0]);
      map.setLayoutProperty('routes', 'line-sort-key', ['case', sel, 1, 0]);
    }
  }
  function fitTo(day, animate) {
    if (!map) return;
    mapUserMoved = false;
    fitPoints(markers.map((m) => m.rec).filter((r) => day === 'all' || r.days.has(day)), animate);
  }
  // pts: { lng, lat } 목록이 다 보이게 맞춘다
  function fitPoints(pts, animate, maxZoom = 13) {
    const opts = { duration: animate ? 700 : 0 };
    if (!pts.length) { map.easeTo({ ...DEFAULT_VIEW, ...opts }); return; }
    if (pts.length === 1) { map.easeTo({ center: [pts[0].lng, pts[0].lat], zoom: Math.max(map.getZoom(), 13), ...opts }); return; }
    const b = new maplibregl.LngLatBounds([pts[0].lng, pts[0].lat], [pts[0].lng, pts[0].lat]);
    pts.forEach((r) => b.extend([r.lng, r.lat]));
    const small = mqMobile.matches, v = Math.min(1, map.getContainer().clientHeight / 300); // 지도를 낮게 줄이면 위아래 여백도 줄여 지점이 잘리지 않게
    map.fitBounds(b, { padding: { top: Math.round(46 * v), bottom: Math.round((small ? 56 : 50) * v), left: 40, right: 56 }, maxZoom, ...opts });
  }
  // 고른 항목으로 지도를 맞춘다: 지점 하나면 그 위치로, 이동(출발·도착)이면 두 곳이 다 보이게. 데스크톱은 이름 팝업도
  function focusEntry(date, id, animate) {
    if (!map) return;
    const keys = getModel().keysOfEntry.get(`${date}#${id}`) || [];
    const recs = keys.map(recOf).filter(Boolean);
    mapUserMoved = false;
    if (!recs.length) { popup.remove(); return; }
    fitPoints(recs, animate, 14);
    const main = recs[recs.length - 1];
    const ev = main.events.find((e) => e.day.date === date && e.item && e.item.id === id) || main.events[0];
    if (mqMobile.matches) popup.remove(); // 휴대폰은 바로 아래 상세에 이름이 보이고, 낮은 지도에선 팝업이 잘린다
    else popup.setLngLat([main.lng, main.lat]).setHTML(popupHTML(main, ev)).addTo(map);
  }
  function refitMap() {
    if (planSel) focusEntry(planSel.date, planSel.id, true);
    else fitTo(currentDay, true);
  }
  // 지도 마커를 누르면 그 지점의 일정 상세를 연다(지금 날짜의 항목 → 그날 밤 숙소 → 첫 일정 순)
  function openFromMarker(rec) {
    const d = currentDay && currentDay !== 'all' ? currentDay : null;
    const ev = (d && rec.events.find((e) => e.day.date === d)) || null;
    if (ev) return openEntry(ev.day.date, ev.item.id);
    const night = (d && rec.nights.find((n) => n.date === d)) || null;
    if (night) return openEntry(night.date, 'stay');
    if (rec.events[0]) return openEntry(rec.events[0].day.date, rec.events[0].item.id);
    if (rec.nights[0]) return openEntry(rec.nights[0].date, 'stay');
  }
  // 목록 행·지도 마커를 눌렀을 때. 휴대폰은 상세를 기록에 쌓아 「← 목록」·뒤로 가기로 닫는다(상세가 열린 채 다른 항목을 누르면 바꿔치기)
  function openEntry(date, id) {
    const hash = `#plan/${date}/${id}`;
    if (location.hash === hash) { route(); return; } // 이미 고른 항목을 다시 누르면 지도를 다시 그곳으로(닫은 팝업도 다시)
    if (!mqMobile.matches || $('#plan-md.show-detail') || currentDay !== date) {
      if (currentDay !== date) navFromList = false; // 다른 날 마커로 바꿔치기하면 뒤로 가기는 엉뚱한 날 목록이다
      go(hash, true); return;
    }
    navFromList = true; go(hash);
  }
  // 휴대폰에서 열린 상세의 윗변을 높이 막대 바로 아래에 맞춘다(지도는 위에 보이게)
  function syncDetailTop() {
    const det = $('#plan-detail');
    if (!det) return;
    det.style.removeProperty('top');
    if (!mqMobile.matches || !$('#plan-md.show-detail')) return;
    det.style.top = Math.max(0, Math.round($('.map-bar').getBoundingClientRect().bottom)) + 'px';
  }

  // ---------- 지도 높이 조절 — 막대를 끌거나 키보드·작게/보통/크게 버튼. 데스크톱·휴대폰 높이를 따로 기억한다
  const MAP_H = { min: 120, step: 40, small: 180, minText: 220 };
  // 로컬 파일은 모두 같은 저장소를 써서 이름을 구분한다
  const mapHKey = () => 'kgs-trip:map-h:' + (mqMobile.matches ? 'mobile' : 'desktop');
  const mapHMem = {}; // 저장소를 못 쓰는 브라우저(사생활 보호 모드 등)에선 이 화면에서만 기억
  function readMapH() {
    const k = mapHKey();
    try { const v = localStorage.getItem(k); if (v != null) return Number(v) || null; } catch { /* 저장소 없음 */ }
    return mapHMem[k] ?? null;
  }
  function writeMapH(h) {
    const k = mapHKey();
    mapHMem[k] = h;
    try { if (h == null) localStorage.removeItem(k); else localStorage.setItem(k, String(h)); } catch { /* 저장소 없음 */ }
  }
  // 최대 높이: 데스크톱은 날짜 탭 아래 목록·상세 칸을 220px 남기고, 휴대폰(탭 전체가 스크롤됨)은 화면 높이의 80% 이되
  // 막대가 첫 화면 안에 남게 한다(지도 위를 끌면 지도가 움직여 화면을 내릴 수 없다)
  function mapHMax() {
    const host = $('#view-plan'), bar = $('.map-bar').offsetHeight;
    if (mqMobile.matches) return Math.max(MAP_H.min, Math.min(Math.round(window.innerHeight * 0.8), host.clientHeight - bar - 40));
    return Math.max(MAP_H.min, host.clientHeight - bar - $('#day-tabs').offsetHeight - MAP_H.minText);
  }
  // h: 픽셀(최소~최대로 자름) 또는 null(기본 높이 = CSS). 계획표가 숨어 있으면 크기를 잴 수 없어 건너뛴다
  function setMapH(h, { save = false, refit = false, from = null } = {}) {
    if ($('#view-plan').hidden) return;
    const wrap = $('#map-wrap'), max = mapHMax(), before = from ?? wrap.offsetHeight; // from: 끌기 시작 때 높이(끄는 동안 이미 바뀌어 있다)
    if (h == null) wrap.style.removeProperty('height');
    else wrap.style.height = Math.round(Math.min(Math.max(h, MAP_H.min), max)) + 'px';
    if (save) writeMapH(h == null ? null : wrap.offsetHeight);
    const now = wrap.offsetHeight, sep = $('#map-resizer');
    sep.setAttribute('aria-valuemin', String(MAP_H.min));
    sep.setAttribute('aria-valuemax', String(max));
    sep.setAttribute('aria-valuenow', String(now));
    sep.setAttribute('aria-valuetext', `지도 높이 ${now}픽셀`);
    wrap.classList.toggle('is-short', now < 220);
    const preset = h == null ? 'normal' : now === Math.min(MAP_H.small, max) ? 'small' : now >= max ? 'large' : '';
    $$('.map-sizes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mapSize === preset)));
    if (map) { map.resize(); if (refit && now !== before && !mapUserMoved) refitMap(); } // 끝에 닿아 그대로면 다시 맞추지 않는다(키를 누르고 있을 때 떨림)

  }
  const mapResizer = $('#map-resizer');
  let mapDrag = null;
  mapResizer.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    mapDrag = { id: e.pointerId, y: e.clientY, h: $('#map-wrap').offsetHeight, next: null, raf: 0 };
    mapResizer.setPointerCapture(e.pointerId);
    mapResizer.focus({ preventScroll: true }); // 아래 preventDefault 가 클릭 포커스를 막으므로 직접 준다(이어서 화살표 키로 조절)
    document.body.classList.add('is-resizing');
    e.preventDefault();
  });
  mapResizer.addEventListener('pointermove', (e) => {
    const d = mapDrag;
    if (!d || e.pointerId !== d.id) return;
    d.next = d.h + e.clientY - d.y;
    if (!d.raf) d.raf = requestAnimationFrame(() => { d.raf = 0; if (mapDrag === d) setMapH(d.next); });
  });
  function endMapDrag(e) {
    const d = mapDrag;
    if (!d || e.pointerId !== d.id) return;
    mapDrag = null;
    cancelAnimationFrame(d.raf);
    document.body.classList.remove('is-resizing');
    if (e.type === 'pointerup') d.next = d.h + e.clientY - d.y;
    if (d.next != null && Math.abs(d.next - d.h) >= 2) setMapH(d.next, { save: true, refit: true, from: d.h });
    else setMapH(readMapH()); // 끌지 않은 클릭·제자리로 돌아온 끌기는 끌던 중 바뀐 높이를 되돌린다
  }
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => mapResizer.addEventListener(t, endMapDrag));
  mapResizer.addEventListener('dblclick', () => setMapH(null, { save: true, refit: true }));
  mapResizer.addEventListener('keydown', (e) => {
    const cur = Math.min($('#map-wrap').offsetHeight, mapHMax()); // 창이 작으면 기본 높이가 최대보다 클 수 있다
    const next = { ArrowUp: cur - MAP_H.step, ArrowDown: cur + MAP_H.step, PageUp: cur - 3 * MAP_H.step, PageDown: cur + 3 * MAP_H.step,
      Home: MAP_H.min, End: Infinity, Enter: null }[e.key];
    if (next === undefined) return;

    setMapH(next, { save: true, refit: true });

  $$('.map-sizes button').forEach((b) => b.addEventListener('click', () => {
    const size = b.dataset.mapSize;
    setMapH(size === 'small' ? MAP_H.small : size === 'large' ? Infinity : null, { save: true, refit: true });
  }));
  // 창 높이가 바뀌면 기억한 높이를 새 최대 높이 안으로 다시 맞춘다(기억한 값은 그대로)
  let mapHRaf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(mapHRaf); mapHRaf = requestAnimationFrame(() => setMapH(readMapH())); });

  // ---------- 시간표 계산 (계획표 상세와 시간표 탭이 같이 쓴다)
  const stopIdx = (dir, ja) => dir.stops.findIndex((s) => s.ja === ja);
  // 계획 항목의 tt: { id, dir, from, to, time | after·arriveBy, count } → 그 일정에 맞는 편
  // arriveBy 는 「그때까지 도착하는 마지막 n편」이라 after(이후 출발)를 함께 주면 그보다 이른, 탈 수 없는 편을 뺀다
  function ttPick(tt) {
    const t = TT[tt.id];
    if (!t || t.kind !== 'bus') return null;
    const dir = (t.dirs || []).find((d) => d.key === tt.dir);
    if (!dir) return null;
    const fi = stopIdx(dir, tt.from), ti = stopIdx(dir, tt.to);
    if (fi < 0 || ti < 0) return { t, dir, fi, ti, pick: [] };
    const rows = dir.trips.map((tr, i) => ({ i, dep: tr.times[fi], arr: tr.times[ti], note: tr.note })).filter((r) => r.dep && r.arr && r.dep < r.arr);
    const n = tt.count || 3;
    let pick;
    if (tt.time) pick = rows.filter((r) => r.dep === tt.time);
    else {
      const later = rows.filter((r) => r.dep >= (tt.after || '00:00'));

    return { t, dir, fi, ti, pick };
  }
  const ttRule = (tt) => (tt.time ? `${tt.time} 출발 편`

  // 시간표 탭에서 강조할 편: 「id/방향/편 번호」 → 그 편을 쓰는 날짜들
  const PLAN_TRIPS = (() => {
    const m = new Map();

      if (!item.tt) return;
      const p = ttPick(item.tt);
      if (!p) return;
      p.pick.forEach((r) => {
        const k = `${item.tt.id}/${p.dir.key}/${r.i}`;
        if (!m.has(k)) m.set(k, []);

    }));
    return m;
  })();
  // 페리 표에서 강조할 시각: 「요일표/항구/시각」 → 그 배를 타는 날짜들(tt.time 을 정한 항목만)
  const FERRY_PLAN = new Map();
  DAYS.forEach((day) => (day.items || []).forEach((item) => {
    if (item.kind !== 'ferry' || !item.tt || !item.tt.time) return;
    const k = `${item.tt.service}/${item.tt.side}/${item.tt.time}`;
    if (!FERRY_PLAN.has(k)) FERRY_PLAN.set(k, []);
    FERRY_PLAN.get(k).push(day);

  const minutes = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };

  // ---------- 상세 공통 조각
  const sec = (title, html, cls) => (html ? `<section class="d-sec${cls ? ' ' + cls : ''}"><h3>${title}</h3>${html}</section>` : '');
  const ul = (arr) => (arr && arr.length ? `<ul>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '');
  function factsHTML(pairs) {
    const rows = (pairs || []).filter((p) => p && p.value != null && p.value !== '').map((p) => `<dt>${esc(p.label)}</dt><dd>${esc(p.value)}</dd>`).join('');
    return rows ? `<dl class="facts">${rows}</dl>` : '';
  }
  // 조사 원본의 uncertain 은 문자열이거나 문장 배열이다
  function uncertainHTML(u) {
    const arr = (Array.isArray(u) ? u : [u]).filter(Boolean);
    if (!arr.length) return '';
    return arr.length === 1 ? `<p class="unc">확인 필요: ${esc(arr[0])}</p>`
      : `<div class="unc">확인 필요<ul>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  }
  // 여러 출처 묶음(항목 자체·장소·시간표)을 한 목록으로. 같은 주소는 한 번만
  function sourcesHTML(parts) {
    const seen = new Set(), src = [], unc = [];
    let verifiedAt = null;
    parts.filter(Boolean).forEach((p) => {
      (p.sources || []).forEach((s) => { if (s && s.url && !seen.has(s.url)) { seen.add(s.url); src.push(s); } });
      if (p.coordSource && /^https?:/.test(p.coordSource) && !seen.has(p.coordSource)) { seen.add(p.coordSource); src.push({ title: `지도 좌표 — ${p.name || ''}`, url: p.coordSource }); }
      unc.push(...(Array.isArray(p.uncertain) ? p.uncertain : [p.uncertain]).filter(Boolean));
      if (p.verifiedAt && (!verifiedAt || p.verifiedAt > verifiedAt)) verifiedAt = p.verifiedAt;
    });
    if (!src.length && !unc.length) return '';
    return `<footer class="d-src"><h3>출처</h3>${src.length ? `<ol>${src.map((s) => `<li>${extLink(s.url, esc(s.title || s.url))}</li>`).join('')}</ol>` : '<p class="muted">없음</p>'}` +

  }
  // 유저가 직접 적은 메모. diff 는 조사 값이 유저 값과 다를 때(덮어쓰지 않고 함께 보인다)
  function mineHTML(notes, diffs) {
    const n = (notes || []).filter(Boolean), d = (diffs || []).filter(Boolean);

  }
  // 장소의 조사 내용: 이용 정보 → 묶음별 목록 → 주의 → 팁

  const stopLabel = (s) => (s ? (s.ko ? `${s.ko}〔${s.ja}〕` : s.ja) : '');

  // 공항버스 항목: 노선·탈 곳·내릴 곳·요금 + 이 일정에 맞는 편
  function busPickHTML(item) {

  // ---------- 계획표: 날짜 탭·패널

  function dayPanelHTML(date) {

    const items = day.items || [];
    return `<div id="plan-md" class="md">
      <div class="md-list"><div class="dl-wrap">
        <div class="day-head" style="--c:${day.color}"><i class="dot"></i><h2>${index + 1}일차 · ${di.long}</h2>${day.tag ? `<span class="pill">${esc(day.tag)}</span>` : ''}</div>
        ${notesHTML(day.notes)}
        <section class="blk"><h3>오늘 밤 숙소</h3>${day.stay && SPOTS.has(day.stay) ? stayRowHTML(day) : `<div class="empty">${isLast ? '출국일이라 숙박이 없습니다.' : '숙소 정보가 없습니다.'}</div>`}</section>
        <section class="blk"><h3>일정</h3>
          ${items.length ? `<ol class="tl">${items.map((item) => rowHTML(day, item)).join('')}</ol>` : '<div class="empty">정한 일정이 없습니다.</div>'}
          <p class="hint">항목을 누르면 ${mqMobile.matches ? '지도 아래에' : '오른쪽에'} 상세가 나오고 지도가 그 위치로 갑니다.</p>
        </section>
      </div></div>
      <article id="plan-detail" class="md-detail"></article>
    </div>`;
  }
  function overviewHTML() {
    const rows = DAYS.map((d, i) => {
      const di = dayInfo(d.date);
      const st = d.stay ? SPOTS.get(d.stay) : null;
      const items = (d.items || []).map((it) => `${it.time ? `<span class="tl-tm">${esc(it.time)}</span>` : ''}${esc(it.title)}`).join('<br>');
      return `<tr data-day="${d.date}"><td class="dcell"><i class="dot" style="--c:${d.color}"></i> ${di.short} (${di.dow})<small>${i + 1}일차${d.tag ? ' · ' + esc(d.tag) : ''}</small></td>
        <td>${items || '<span class="muted">—</span>'}</td>
        <td>${st ? esc(st.name) : `<span class="muted">${i === DAYS.length - 1 ? '— (출국)' : '—'}</span>`}</td></tr>`;
    }).join('');
    return `<div class="dp-wrap ov">
      <div class="ov-flights">${(DATA.flights || []).map((f) => flightHTML(f)).join('')}</div>
      ${notesHTML(DATA.meta.overviewNotes)}
      <section class="blk"><h3>날짜별 요약 (행을 누르면 그날로 이동)</h3>
        <table class="ov-days"><thead><tr><th>날짜</th><th>일정</th><th>숙소</th></tr></thead><tbody>${rows}</tbody></table>
      </section>
      <p class="hint">날짜 탭을 누르면 그날 숙소·방문지·동선만 진하게, 다른 날짜는 흐리게 보입니다.</p>
    </div>`;
  }
  // 그날 목록에서 항목을 고른다. 데스크톱은 주소에 항목이 없으면 첫 일정을 보여 주고, 휴대폰은 목록만 둔다
  function selectEntry(date, id, dayChanged) {
    const md = $('#plan-md'), host = $('#view-plan'), mobile = mqMobile.matches;
    const day = dayByDate.get(date).day;
    const es = entriesOf(day);
    const e = (id && es.find((x) => x.id === id)) || (mobile ? null : es[0]);
    $$('.tl-item[data-item]', md).forEach((r) => {
      const on = !!e && r.dataset.item === e.id;
      r.classList.toggle('is-sel', on);
      r.setAttribute('aria-current', String(on));
    });
    const det = $('#plan-detail');
    const prevId = (det.dataset.cur || '').split('/')[1];
    const key = e ? `${date}/${e.id}` : '';
    if (det.dataset.cur !== key) {
      det.innerHTML = e ? (e.id === 'stay' ? stayDetailHTML(day) : itemDetailHTML(day, e.item)) : (mobile ? '' : '<div class="d-empty">일정이 없습니다.</div>');
      det.dataset.cur = key;
      det.scrollTop = 0;
    }
    const show = mobile && !!(id && e), was = md.classList.contains('show-detail');
    md.classList.toggle('show-detail', show);
    // 휴대폰: 상세는 지도 아래를 덮는다. 목록을 내려 지도가 화면 밖이면 맨 위로 올려 지도를 보이고, 닫으면 보던 자리로 돌린다
    if (show && !was) { md.dataset.listY = String(host.scrollTop); host.scrollTop = 0; }
    else if (!show && was) host.scrollTop = Number(md.dataset.listY) || 0;
    host.style.overflow = show ? 'hidden' : ''; // 상세가 열린 동안 뒤 화면이 스크롤되면 막대가 움직여 지도와 상세 사이가 벌어진다
    syncDetailTop();
    // 휴대폰에서 상세가 목록을 덮으면 가려진 목록은 포커스·스크린리더에서 빼고, 열 때·닫을 때 포커스를 옮긴다
    $('.md-list', md).inert = show;
    $('#day-tabs').inert = show; // 가려진 날짜 탭에 키보드 포커스가 가서 좌우 키로 날짜가 바뀌지 않게
    if (show && !was) $('.back', det)?.focus({ preventScroll: true });
    else if (!show && was && prevId) $(`.tl-item[data-item="${CSS.escape(prevId)}"]`, md)?.focus({ preventScroll: true });
    if (e && !mobile) $(`.tl-item[data-item="${CSS.escape(e.id)}"]`, md)?.scrollIntoView({ block: 'nearest' });
    // 지도는 맨 끝에(지도 쪽이 실패해도 목록·상세·포커스는 이미 맞춰 둔다)
    planSel = id && e ? { date, id: e.id } : null;
    if (!map) return;
    applyEmphasis(date);
    if (planSel) focusEntry(date, e.id, !dayChanged);
    else { popup.remove(); if (dayChanged) fitTo(date, renderPlan.done); }
  }
  let planBuiltFor = null; // 지금 그려 둔 날짜 패널(날짜·휴대폰 여부)
  function renderPlan(day, id) {
    const built = `${day}|${mqMobile.matches}`;
    const dayChanged = planBuiltFor !== built;
    currentDay = day;
    renderDayTabs(day);
    setMapH(readMapH()); // 기억해 둔 지도 높이(없으면 기본 높이)를 지도를 만들기 전에 맞춘다
    ensureMap();
    const panel = $('#day-panel');
    if (dayChanged) {
      const host = $('#view-plan');
      host.style.overflow = '';
      panel.classList.toggle('is-md', day !== 'all');
      panel.innerHTML = day === 'all' ? overviewHTML() : dayPanelHTML(day);
      panel.scrollTop = 0;
      planBuiltFor = built;
      if (mqMobile.matches && !id) { // 휴대폰은 #view-plan 이 스크롤된다 — 읽던 자리가 아니라 새 날짜 머리말이 날짜 탭 바로 아래에 오게
        const gap = panel.getBoundingClientRect().top - host.getBoundingClientRect().top - $('#day-tabs').offsetHeight;
        if (gap < 0) host.scrollTop += gap;
      }
    }
    if (map) map.resize();
    if (day === 'all') {
      planSel = null;
      $('#day-tabs').inert = false; // 휴대폰 상세에서 뒤로 가기로 [전체] 에 오면 selectEntry 를 거치지 않는다
      if (map) { popup.remove(); applyEmphasis('all'); if (dayChanged) fitTo('all', renderPlan.done); }
    } else selectEntry(day, id, dayChanged);
    renderPlan.done = true;
  }

  // ---------- TODO 리스트·음식·참고사항
  function renderPage(view) {
    const body = $(`#${view}-body`);
    if (body.dataset.built) return;
    if (view === 'todo') body.innerHTML = `<h2>TODO 리스트</h2>${listHTML(DATA.todos)}`;
    else if (view === 'food') body.innerHTML = `<h2>먹고 싶은 음식</h2>${listHTML(DATA.foods)}`;
    else body.innerHTML = notesPageHTML();
    body.dataset.built = '1';
  }
  // 문자열 또는 { text, sub[], diffs[] }
  function listHTML(arr) {
    if (!arr || !arr.length) return '<div class="empty">항목이 없습니다.</div>';
    return `<ul class="plain">${arr.map((x) => {
      const o = typeof x === 'string' ? { text: x } : x;
      const subs = (o.sub || []).map((s) => `<li>${esc(s)}</li>`).join('') + (o.diffs || []).map((d) => `<li class="diff">조사 결과: ${esc(d)}</li>`).join('');
      return `<li>${esc(o.text)}${subs ? `<ul>${subs}</ul>` : ''}</li>`;
    }).join('')}</ul>`;
  }
  function notesPageHTML() {
    const groups = (DATA.notes || []).map((g) => `<section class="pg-sec">${g.title ? `<h3>${esc(g.title)}</h3>` : ''}${listHTML(g.items)}${sourcesHTML([g])}</section>`).join('');
    const stays = [...new Set(DAYS.map((d) => d.stay).filter((id) => SPOTS.has(id)))];
    const rows = stays.map((id) => {
      const s = SPOTS.get(id);
      const ds = DAYS.filter((d) => d.stay === id);
      const nights = ds.map((d) => dayInfo(d.date).short).join(', ');
      const warn = [...(s.userNotes || []), ...ds.flatMap((d) => d.stayNotes || [])];
      return `<tr><td><a href="#plan/${ds[0].date}/stay">${esc(s.name)}</a><br><small lang="ja" class="muted">${esc(s.nameJa || '')}</small></td><td>${nights} 밤</td><td>${esc(s.checkIn || '확인 필요')}</td><td>${esc(s.checkOut || '확인 필요')}</td><td>${warn.map(esc).join('<br>') || '—'}</td></tr>`;
    }).join('');
    return `<h2>참고사항</h2>${groups}
      ${rows ? `<section class="pg-sec"><h3>숙소 한눈에 (이름을 누르면 상세)</h3><div class="tt-scroll"><table class="stays"><thead><tr><th>숙소</th><th>숙박</th><th>체크인</th><th>체크아웃</th><th>내 메모</th></tr></thead><tbody>${rows}</tbody></table></div></section>` : ''}`;
  }

  // ---------- 시간표
  let ferrySvc = null; // 페리 표: 평일 / 토·일·공휴일
  function renderTimetable(id) {
    const isBus = id !== 'ferry';
    $$('#tt-seg button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tt === (isBus ? 'bus' : 'ferry'))));
    const sub = $('#tt-sub');
    sub.hidden = !isBus;
    if (!sub.dataset.built) {
      sub.innerHTML = ['bus-city', 'bus-myoken'].map((k) => {
        const t = TT[k] || {};
        return `<button type="button" role="tab" data-tt-id="${k}"><span>${esc(t.tabLabel || k)}</span><small lang="ja">${esc(t.tabLabelJa || '')}</small></button>`;
      }).join('');
      sub.dataset.built = '1';
    }
    $$('#tt-sub button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.ttId === id)));
    $('#tt-body').innerHTML = isBus ? busTableHTML(id) : ferryTableHTML();
    $('#tt-body').dataset.cur = id;
  }
  function ttFactsHTML(t, extra) {
    return factsHTML([
      { label: '노선', value: t.routeName }, { label: '운행 회사', value: (t.operators || []).join(' · ') },
      { label: '요금', value: t.fare }, { label: '공항 승차장', value: t.airportBoarding },
      ...(extra || []),
      { label: '시간표 기준', value: t.revision ? `${t.revision} ${t.kind === 'ferry' ? '시행' : '개정'}` : t.revisionText || '확인 필요' },
    ]);
  }
  function busTableHTML(id) {
    const t = TT[id];
    if (!t) return '<div class="empty">시간표 자료가 없습니다.</div>';
    const extra = t.nearestStop ? [{ label: '숙소 가까운 정류장', value: `${stopLabel(t.nearestStop)}${t.nearestStop.walk ? ' · ' + t.nearestStop.walk : ''}` }] : [];
    const dirs = (t.dirs || []).map((dir) => {
      const first = dir.stops[0], last = dir.stops[dir.stops.length - 1];
      const head = `<tr>${dir.stops.map((s) => `<th scope="col"><span>${esc(s.ko || s.ja)}</span><small lang="ja">${esc(s.ko ? s.ja : '')}</small></th>`).join('')}<th scope="col">비고</th></tr>`;
      const rows = dir.trips.map((tr, i) => {
        const days = PLAN_TRIPS.get(`${id}/${dir.key}/${i}`) || [];
        const badges = days.map((d) => `<span class="pl" style="--c:${esc(d.color)}">${dayInfo(d.date).short} 계획</span>`).join('');
        return `<tr${days.length ? ' class="is-plan"' : ''}>${tr.times.map((x) => (x ? `<td>${esc(x)}</td>` : '<td class="na">—</td>')).join('')}<td class="nt">${badges}${esc(tr.note || '')}</td></tr>`;
      }).join('');
      return `<section class="tt-dir"><h3>${esc(first.ko || first.ja)} → ${esc(last.ko || last.ja)}</h3><p><span lang="ja">${esc(first.ja)} → ${esc(last.ja)}</span> · ${dir.trips.length}편 · 「—」는 서지 않는 정류장</p>
        <div class="tt-scroll"><table class="tt"><thead>${head}</thead><tbody>${rows || `<tr><td colspan="${dir.stops.length + 1}">편 자료가 없습니다.</td></tr>`}</tbody></table></div></section>`;
    }).join('');
    return `<div class="tt-head"><h2>${esc(t.title || '')}</h2>${t.titleJa ? `<p lang="ja">${esc(t.titleJa)}</p>` : ''}</div>
      <div class="d-sec">${ttFactsHTML(t, extra)}</div>
      ${notesHTML((t.notes || []).map((x) => (typeof x === 'string' ? { text: x } : x)))}
      ${dirs}${sourcesHTML([t])}`;
  }
  function ferryTableHTML() {
    const t = TT.ferry;
    if (!t) return '<div class="empty">시간표 자료가 없습니다.</div>';
    const svcs = t.services || [];
    if (!ferrySvc || !svcs.some((s) => s.key === ferrySvc)) ferrySvc = (svcs.find((s) => s.key === t.defaultService) || svcs[0] || {}).key;
    const svc = svcs.find((s) => s.key === ferrySvc);
    const byHour = (side) => {
      const h = new Map();
      side.times.forEach((x) => { const k = x.slice(0, 2); if (!h.has(k)) h.set(k, []); h.get(k).push(x); });
      const cell = (x) => {
        const days = FERRY_PLAN.get(`${svc.key}/${side.key}/${x}`) || [];
        return days.length ? `<mark class="is-plan">${esc(x.slice(3))}${days.map((d) => `<span class="pl" style="--c:${esc(d.color)}">${dayInfo(d.date).short} 계획</span>`).join('')}</mark>` : esc(x.slice(3));
      };
      return [...h].map(([k, xs]) => `<tr><th>${esc(k)}시</th><td>${xs.map(cell).join('  ')}</td></tr>`).join('');
    };
    const sides = svc ? svc.sides.map((s) => `<section class="tt-dir"><h3>${esc(s.title)}</h3><p>${esc(s.from || '')} → ${esc(s.to || '')} · ${s.times.length}편</p>
      <div class="tt-scroll"><table class="tt-h"><tbody>${byHour(s) || '<tr><td>자료 없음</td></tr>'}</tbody></table></div></section>`).join('') : '';
    return `<div class="tt-head"><h2>${esc(t.title || '')}</h2>${t.titleJa ? `<p lang="ja">${esc(t.titleJa)}</p>` : ''}</div>
      <div class="d-sec">${ttFactsHTML(t, [{ label: '소요', value: t.durationMin ? `약 ${t.durationMin}분` : null }, { label: '운항', value: t.operatingHours }])}</div>
      ${notesHTML((t.notes || []).map((x) => (typeof x === 'string' ? { text: x } : x)))}
      <div class="seg seg-sub" id="ferry-svc" role="tablist" aria-label="요일">${svcs.map((s) => `<button type="button" role="tab" data-svc="${esc(s.key)}" aria-selected="${s.key === ferrySvc}">${esc(s.title)}${s.hint ? `<small>${esc(s.hint)}</small>` : ''}</button>`).join('')}</div>
      <div class="tt-hours">${sides}</div>${sourcesHTML([t])}`;
  }

  // ---------- 이벤트
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('a')) return;
    const row = t.closest('#plan-md .tl-item[data-item]');
    if (row) { openEntry(currentDay, row.dataset.item); return; }
    if (t.closest('[data-back]')) {
      if (navFromList) { navFromList = false; history.back(); return; }
      go(`#plan/${currentDay}`, true); // 주소로 바로 연 상세 등: 기록을 더 쌓으면 뒤로 가기가 닫은 상세를 다시 연다
      return;
    }
    const mt = t.closest('.main-tabs button');
    if (mt) { go(lastHash[mt.dataset.view]); return; }
    const dt = t.closest('#day-tabs button');
    if (dt) { go(dt.dataset.day === 'all' ? '#plan' : `#plan/${dt.dataset.day}`, true); return; }
    const ov = t.closest('tr[data-day]');
    if (ov) { go(`#plan/${ov.dataset.day}`, true); return; }
    const seg = t.closest('#tt-seg button');
    if (seg) { go(seg.dataset.tt === 'ferry' ? '#timetable/ferry' : `#timetable/${lastBus}`, true); return; }
    const sub = t.closest('#tt-sub button');
    if (sub) { lastBus = sub.dataset.ttId; go(`#timetable/${lastBus}`, true); return; }
    const sv = t.closest('#ferry-svc button');
    if (sv) { ferrySvc = sv.dataset.svc; renderTimetable('ferry'); }
  });
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.tl-item')) { e.preventDefault(); t.click(); return; }
    if (t.closest && t.closest('#day-tabs') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const btns = $$('#day-tabs button');
      const i = btns.indexOf(t.closest('button'));
      const n = btns[(i + (e.key === 'ArrowRight' ? 1 : -1) + btns.length) % btns.length];
      n.focus(); n.click(); e.preventDefault(); return;
    }
    const row = t.closest && t.closest('#plan-md .tl-item');
    if (row && !mqMobile.matches && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { // 휴대폰 배치에선 기록이 쌓여 「← 목록」이 꼬이므로 끔
      const rows = $$('#plan-md .tl-item');
      const n = rows[rows.indexOf(row) + (e.key === 'ArrowDown' ? 1 : -1)];
      if (n) { n.focus(); n.click(); }
      e.preventDefault();
    }
  });
  window.addEventListener('hashchange', route);
  mqMobile.addEventListener('change', route); // 날짜 패널은 휴대폰 여부가 바뀌면 다시 그린다(planBuiltFor)

  // ---------- 시작
  $('#trip-title').textContent = DATA.meta.title || '여행 계획';
  $('#trip-period').textContent = DATA.meta.period || '';
  route();
})();
</script>
</body>
</html>
